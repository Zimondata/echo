# Example credentials structure
# Copy this to your encrypted credentials: rails credentials:edit

google:
  client_id: YOUR_GOOGLE_CLIENT_ID_HERE
  client_secret: YOUR_GOOGLE_CLIENT_SECRET_HERE
  redirect_uri: http://localhost:3000/auth/google/callback

# OpenAI API key for AI features
openai:
  api_key: YOUR_OPENAI_API_KEY_HERE

# Telegram Bot token for Telegram integration
telegram:
  bot_token: YOUR_TELEGRAM_BOT_TOKEN_HERE

# Database URL for production (development/test use local database.yml)
database:
  url: postgresql://user:password@host:5432/database_name